<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>萬聖節 AR 尋寶大作戰 - Halloween Monster Catcher</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- jsQR -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script>
        window.ensureJsQR = function () {
            if (typeof window.jsQR === "function") {
                return Promise.resolve(true);
            }

            return new Promise((resolve) => {
                const fallback = document.createElement("script");
                fallback.src = "https://unpkg.com/jsqr@1.4.0/dist/jsQR.js";
                fallback.onload = () => resolve(typeof window.jsQR === "function");
                fallback.onerror = () => resolve(false);
                document.head.appendChild(fallback);
            });
        };
    </script>

    <!-- QRCode Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>
        tailwind.config = {
            theme: {

                    colors: {

                            orange: '#ff6b00',
                            green: '#00ff66',
                            yellow: '#ffd700',
                            red: '#e63946'
                        }
                    }
                }
            }
        }
    </script>
